name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docent-dev-deployment
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GOOGLE_CLOUD_LOCATION: europe-north1
  DOCENT_APP_URL: ${{ vars.DOCENT_APP_URL }}
  DOCENT_OAUTH_SECRET_ROLLOUT: ${{ vars.DOCENT_OAUTH_SECRET_ROLLOUT || '2' }}
  IMAGE_REPOSITORY: europe-north1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docent/web

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://docent:docent@127.0.0.1:5432/docent?sslmode=disable
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-32-characters
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_CLOUD_PROJECT: docent-ci
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docent
          POSTGRES_USER: docent
          POSTGRES_PASSWORD: docent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docent -d docent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx --yes dbmate@2.34.1 --no-dump-schema up
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run infra:synth

  infrastructure:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Validate deployment configuration
        run: |
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$DOCENT_APP_URL"
      - run: npm run infra:deploy -- --auto-approve

  migrate:
    needs: infrastructure
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Validate database configuration
        run: test -n "$DATABASE_URL"
      - name: Apply database migrations
        run: npx --yes dbmate@2.34.1 --no-dump-schema up

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
      - name: Build and push container image
        run: |
          image="$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker build --tag "$image" --tag "$IMAGE_REPOSITORY:latest" .
          docker push "$image"
          docker push "$IMAGE_REPOSITORY:latest"
      - name: Deploy Cloud Run revision
        run: gcloud run services update docent-dev --project="$GOOGLE_CLOUD_PROJECT" --region="$GOOGLE_CLOUD_LOCATION" --image="$IMAGE_REPOSITORY:$GITHUB_SHA" --quiet
      - name: Smoke test deployed service
        run: curl --fail --retry 5 --retry-delay 5 "$DOCENT_APP_URL"
