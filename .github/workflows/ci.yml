name: CI
on: [pull_request, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: docent-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run infra:synth
