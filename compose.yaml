services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docent
      POSTGRES_USER: docent
      POSTGRES_PASSWORD: docent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docent -d docent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - docent-postgres:/var/lib/postgresql/data

volumes:
  docent-postgres:
